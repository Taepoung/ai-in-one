# 세 OS 에서 검사를 돈다 (2026-10-21).
#
# «모든 OS · 모든 에이전트를 확인한다» 를 손으로는 못 지켰다 — 이 기계는 Windows 이고,
# Linux 는 WSL 로 한 번씩 돌렸고, macOS 는 어떤 길로도 못 돌렸다. 여기서 매번 돈다.
#
# ⚠️ 진짜 에이전트를 띄우는 프로브(tests/probes/)는 **안 돈다** — 로그인이 필요하고
# 구독 할당량을 쓴다. 손으로 돌린다(docs/BUMP.md). 여기는 가짜 에이전트로 도는 npm test 다.
name: 검사

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false # 한 OS 가 깨져도 나머지 결과를 본다 — OS 마다 다른 것을 찾으려는 것이다
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 사용자에게 받아 주는 Node 와 같은 판 (src/core/install/nodePin.ts)
          node-version: "24.21.0"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
